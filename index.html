<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FACE Prep Campus — Insight Deck</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#EDEFEC;
  --surface:#FFFFFF;
  --surface-2:#F5F6F3;
  --ink:#141414;
  --ink-dim:#71757A;
  --ink-faint:#A2A6AB;
  --line:rgba(20,20,20,.09);
  --line-soft:rgba(20,20,20,.05);
  --orange:#FF6A45;
  --orange-dark:#E8531F;
  --orange-soft:#FFE7DE;
  --mint:#2FAE66;
  --mint-soft:#E4F6EA;
  --amber:#F2A93A;
  --amber-soft:#FCEED8;
  --purple:#8C7CF0;
  --dark:#151515;
  --shadow-md:0 16px 34px -20px rgba(20,20,20,.18);
  --shadow-lg:0 30px 60px -24px rgba(20,20,20,.26);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden;}
::selection{background:var(--orange);color:#fff;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D9DBD6;border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:#C6C9C3;}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}

.shell{position:relative;z-index:1;display:flex;height:100vh;overflow:hidden;padding:18px;}

/* ── Main ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-md);}
.main-head{padding:18px 28px 0;flex-shrink:0;}
.mh-mark{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.mh-mark-icon{width:30px;height:30px;border-radius:10px;background:var(--dark);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:800;font-size:11px;color:var(--orange);flex-shrink:0;}
.mh-eyebrow{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}
.mh-brandname{font-family:'Inter',sans-serif;font-size:13px;font-weight:900;letter-spacing:-.01em;color:var(--ink);line-height:1.15;text-transform:uppercase;}
.mh-titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.mh-title{font-family:'Inter',sans-serif;font-size:24px;font-weight:900;letter-spacing:-.03em;color:var(--ink);text-transform:uppercase;}
.mh-ticker{display:flex;gap:8px;}
.mh-tick{padding:9px 16px;text-align:left;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);min-width:74px;}
.mh-tick b{display:block;font-family:'Inter',sans-serif;font-size:18px;font-weight:900;color:var(--ink);letter-spacing:-.02em;}
.mh-tick span{font-size:8.5px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.mh-tick.is-open{background:var(--dark);border-color:var(--dark);}
.mh-tick.is-open b{color:var(--orange);}
.mh-tick.is-open span{color:rgba(255,255,255,.5);}
.mh-tick.is-resolved b{color:var(--mint);}
.mh-toolrow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;flex-wrap:wrap;}
.mh-hint{font-size:11px;color:var(--ink-faint);font-weight:500;}
.sb-refresh{width:32px;height:32px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .12s,color .12s;}
.sb-refresh:hover{background:var(--dark);color:#fff;}
.sb-refresh svg{width:13px;height:13px;}
@keyframes spin{to{transform:rotate(360deg);}}
.sb-refresh.spinning svg{animation:spin .7s linear infinite;}
.mh-divider{height:1px;background:var(--line);margin:14px 0 0;}

.main-body{flex:1;min-height:0;overflow-y:auto;padding:18px 28px 32px;}

/* ── Matrix (heatmap) ── */
.matrix-wrap{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-2);overflow:auto;box-shadow:var(--shadow-md);}
.matrix-grid{display:grid;}
.mx-corner{position:sticky;top:0;left:0;z-index:6;background:var(--surface-2);border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;align-items:flex-end;padding:14px 16px;}
.mx-corner span{font-family:'Inter',sans-serif;font-size:12px;font-weight:700;color:var(--ink-faint);}
.mx-colhead{position:sticky;top:0;z-index:4;background:var(--surface-2);border-bottom:1px solid var(--line);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding:12px 0 12px;cursor:pointer;transition:background .12s;}
.mx-colhead:hover{background:#EBEDE8;}
.mx-colhead .mx-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.mx-colhead .mx-label{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-size:10.5px;font-weight:700;color:var(--ink-dim);letter-spacing:.01em;white-space:nowrap;max-height:112px;overflow:hidden;text-overflow:ellipsis;}
.mx-rowhead{position:sticky;left:0;z-index:3;background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;cursor:pointer;transition:background .12s;}
.mx-rowhead:hover{background:#EBEDE8;}
.mx-rowhead-name{font-size:11px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mx-rowhead-count{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:800;color:var(--ink-faint);flex-shrink:0;}
.mx-cell{display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:11px;font-weight:800;color:var(--ink);border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);cursor:pointer;position:relative;transition:filter .1s;}
.mx-cell:hover{filter:brightness(1.06);}
.mx-cell.empty{cursor:default;color:var(--ink-faint);font-weight:500;}
.mx-cell.empty:hover{filter:none;}

.empty-block{padding:80px 20px;text-align:center;color:var(--ink-dim);}
.empty-block .ic{width:64px;height:64px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--ink-faint);}
.empty-block strong{font-family:'Inter',sans-serif;font-size:18px;font-weight:900;display:block;color:var(--ink);text-transform:uppercase;}
.empty-block p{font-size:12.5px;color:var(--ink-faint);margin-top:6px;}

.skel-grid{display:flex;flex-direction:column;gap:12px;max-width:820px;}
.skel-row{height:74px;border-radius:var(--r-md);background:linear-gradient(90deg,var(--surface-2) 25%,#EBEDE8 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;}
@keyframes shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

/* ── Drawer ── */
.drawer-overlay{position:fixed;inset:0;background:rgba(15,15,15,.45);backdrop-filter:blur(2px);z-index:80;opacity:0;pointer-events:none;transition:opacity .22s;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:18px;right:18px;bottom:18px;width:min(500px,92vw);background:var(--surface);z-index:90;box-shadow:var(--shadow-lg);transform:translateX(calc(100% + 18px));transition:transform .32s cubic-bezier(.19,1,.22,1);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;}
.drawer.open{transform:translateX(0);}
.drawer-head{background:var(--dark);padding:22px 24px;flex-shrink:0;position:relative;}
.drawer-head::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--orange);}
.drawer-head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
.drawer-eyebrow{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em;}
.drawer-eyebrow .stamp{width:28px;height:28px;border-radius:50%;border:1.6px solid var(--cat-color,var(--orange));display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--cat-color,var(--orange));background:#fff;}
.drawer-title{font-family:'Inter',sans-serif;font-size:21px;font-weight:900;margin-top:9px;letter-spacing:-.02em;color:#fff;text-transform:uppercase;}
.drawer-meta{font-size:12px;color:rgba(255,255,255,.6);margin-top:5px;font-weight:500;}
.drawer-close{width:32px;height:32px;border-radius:99px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;transition:background .12s;}
.drawer-close:hover{background:rgba(255,255,255,.16);}
.drawer-search{margin-top:16px;position:relative;}
.drawer-search input{width:100%;padding:10px 12px 10px 32px;border-radius:99px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:#fff;font-size:12.5px;outline:none;}
.drawer-search input::placeholder{color:rgba(255,255,255,.45);}
.drawer-search input:focus{border-color:var(--orange);}
.drawer-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:rgba(255,255,255,.5);}
.drawer-body{flex:1;overflow-y:auto;padding:18px 24px 32px;background:var(--surface-2);}

.tk-row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 17px;margin-bottom:12px;cursor:pointer;transition:border-color .12s,transform .12s;box-shadow:var(--shadow-md);}
.tk-row:hover{border-color:rgba(20,20,20,.16);transform:translateX(2px);}
.tk-row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.tk-who{display:flex;align-items:center;gap:10px;min-width:0;}
.tk-avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;}
.tk-name{font-size:13px;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tk-roll{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--ink-faint);font-weight:600;}
.tk-time{font-size:10.5px;color:var(--ink-faint);flex-shrink:0;white-space:nowrap;margin-top:2px;font-family:'Inter',sans-serif;font-weight:600;}
.tk-subject{font-size:13px;font-weight:700;color:var(--ink);margin-top:11px;line-height:1.45;}
.tk-desc{font-size:12px;color:var(--ink-dim);margin-top:6px;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.tk-row.expanded .tk-desc{-webkit-line-clamp:unset;}
.tk-foot{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;}
.tk-pill{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;padding:4px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em;}
.tk-pill.college{background:var(--surface-2);color:var(--ink-dim);text-transform:none;font-weight:600;letter-spacing:0;border:1px solid var(--line);}
.tk-pill.st-open{background:var(--orange-soft);color:var(--orange-dark);}
.tk-pill.st-progress{background:var(--amber-soft);color:#B5750F;}
.tk-pill.st-resolved{background:var(--mint-soft);color:var(--mint);}
.tk-pill.pr-high{background:var(--orange);color:#fff;}
.tk-pill.pr-medium{background:var(--amber-soft);color:#B5750F;}
.tk-pill.pr-low{background:var(--surface-2);color:var(--ink-dim);border:1px solid var(--line);}
.drawer-empty{padding:44px 10px;text-align:center;color:var(--ink-faint);font-size:12.5px;}

@media (max-width:860px){
  .shell{padding:0;}
  .main{border-radius:0;border:none;}
  .main-head,.main-body{padding-left:18px;padding-right:18px;}
  .drawer{top:0;right:0;bottom:0;border-radius:0;}
}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important;} }
.hidden{display:none !important;}
</style>
</head>
<body>
<div class="shell">
  <div class="main">
    <div class="main-head">
      <div class="mh-mark">
        <div class="mh-mark-icon">FP</div>
        <div>
          <div class="mh-eyebrow">Campus Help Desk</div>
          <div class="mh-brandname">Insight Deck</div>
        </div>
      </div>
      <div class="mh-titlerow">
        <div class="mh-title">All Colleges</div>
        <div class="mh-ticker">
          <div class="mh-tick"><b id="mh-stat-total">0</b><span>Tickets</span></div>
          <div class="mh-tick is-open"><b id="mh-stat-open">0</b><span>Unresolved</span></div>
          <div class="mh-tick is-resolved"><b id="mh-stat-resolved">0</b><span>Resolved</span></div>
          <div class="mh-tick"><b id="mh-stat-cats">0</b><span>Categories</span></div>
        </div>
      </div>
      <div class="mh-toolrow">
        <div class="mh-hint">Every cell is a college × category. Darker means busier — click any cell to see the tickets.</div>
        <button class="sb-refresh" id="sb-refresh-btn" title="Refresh">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.5 2.5A6.5 6.5 0 1 1 8 1.5"/><polyline points="13.5,2.5 13.5,6 10,6"/></svg>
        </button>
      </div>
      <div class="mh-divider"></div>
    </div>
    <div class="main-body" id="main-body">
      <div class="skel-grid" id="skel-grid">
        <div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div>
      </div>
      <div class="matrix-wrap hidden" id="matrix-wrap"><div class="matrix-grid" id="matrix-grid"></div></div>
      <div class="empty-block hidden" id="empty-block"></div>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-head-top">
      <div style="min-width:0;">
        <div class="drawer-eyebrow"><span id="drawer-eyebrow-text">Category</span></div>
        <div class="drawer-title" id="drawer-title">—</div>
        <div class="drawer-meta" id="drawer-meta">—</div>
      </div>
      <button class="drawer-close" id="drawer-close-btn">✕</button>
    </div>
    <div class="drawer-search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><line x1="10.8" y1="10.8" x2="14" y2="14"/></svg>
      <input id="drawer-search-input" type="text" placeholder="Search by name, roll no., problem…" oninput="renderDrawerList()" />
    </div>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script>
/* ── Supabase (same public tickets table as the main help-desk dashboard) ── */
const SUPABASE_URL = 'https://rysajbwcuieovbsllaas.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5c2FqYndjdWllb3Zic2xsYWFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NjI3MjgsImV4cCI6MjA5NjAzODcyOH0.2WenjYKsfQYAeUJxVJcEVQwqYUlfwrYltrMuC9Ggu4A';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const show = el => el.classList.remove('hidden');
const hide = el => el.classList.add('hidden');
function escHTML(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtRel(iso){
  if(!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h = Math.floor(m/60);
  if(h<24) return h+'h ago';
  const d = Math.floor(h/24);
  if(d<30) return d+'d ago';
  return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}
function initials(name){
  const parts = String(name||'?').trim().split(/\s+/);
  return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase() || '?';
}
function catAbbrev(cat){
  const words = String(cat||'?').trim().split(/\s+/).filter(w => w.length>1);
  if(words.length>=2) return (words[0][0]+words[1][0]).toUpperCase();
  return String(cat||'?').slice(0,2).toUpperCase();
}
function avatarColor(name){
  const palette = ['#FF6A45','#151515','#2FAE66','#8C7CF0','#E8531F','#F2A93A','#3A6FF7','#0EA5A4'];
  let h = 0; for(const c of String(name||'')) h = (h*31 + c.charCodeAt(0)) % 997;
  return palette[h % palette.length];
}
const CATEGORY_PALETTE = ['#FF6A45','#F2A93A','#2FAE66','#8C7CF0','#E8531F','#3A6FF7','#151515','#F2725A','#4CBE7C','#F4C542','#6B5CE0','#0EA5A4'];
function categoryColor(cat){
  let h = 0; for(const c of String(cat||'')) h = (h*31 + c.charCodeAt(0)) % 9973;
  return CATEGORY_PALETTE[h % CATEGORY_PALETTE.length];
}
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const n = parseInt(h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
}

/* ── State ── */
let tickets = [];
let activeDrawerCategory = null;
let activeDrawerCollege = null;

async function loadAll(manual){
  const btn = $('sb-refresh-btn');
  if(manual && btn) btn.classList.add('spinning');
  if(!tickets.length){ show($('skel-grid')); hide($('matrix-wrap')); hide($('empty-block')); }
  try{
    const { data, error } = await sb.from('tickets').select('*').order('created_at', { ascending:false });
    if(error) throw error;
    tickets = data || [];
  }catch(e){
    console.error(e);
  }finally{
    if(manual && btn) setTimeout(()=>btn.classList.remove('spinning'), 400);
    renderMain();
  }
}
$('sb-refresh-btn').addEventListener('click', () => loadAll(true));

/* ── Aggregation helpers ── */
function buildCollegeSummary(){
  const map = {};
  tickets.forEach(t => {
    const c = t.college || 'Unspecified';
    if(!map[c]) map[c] = { total:0, open:0, byCat:{} };
    map[c].total++;
    if(t.status !== 'resolved') map[c].open++;
    const cat = t.category || 'Other';
    map[c].byCat[cat] = (map[c].byCat[cat]||0) + 1;
  });
  return map;
}
function aggregateAllCategories(){
  const byCat = {};
  tickets.forEach(t => { const c = t.category || 'Other'; byCat[c] = (byCat[c]||0)+1; });
  return byCat;
}

/* ── Main ── */
function renderMain(){
  hide($('skel-grid'));
  $('mh-stat-total').textContent = tickets.length;
  $('mh-stat-open').textContent = tickets.filter(t => t.status !== 'resolved').length;
  $('mh-stat-resolved').textContent = tickets.filter(t => t.status === 'resolved').length;
  $('mh-stat-cats').textContent = Object.keys(aggregateAllCategories()).length;

  hide($('matrix-wrap')); hide($('empty-block'));

  if(!tickets.length){
    show($('empty-block'));
    $('empty-block').innerHTML = `
      <div class="ic"><svg width="26" height="26" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3" width="13" height="10" rx="2"/><path d="M1.5 6h13"/></svg></div>
      <strong>No tickets yet</strong>
      <p>Nothing to show yet.</p>`;
    return;
  }
  renderMatrix();
}

/* ── Matrix (heatmap) view — the only view ── */
function renderMatrix(){
  const wrap = $('matrix-wrap'); const grid = $('matrix-grid');
  show(wrap);
  const summary = buildCollegeSummary();
  const collegeNames = Object.keys(summary).sort((a,b) => summary[b].total - summary[a].total);
  const globalCats = aggregateAllCategories();
  const categories = Object.keys(globalCats).sort((a,b) => globalCats[b]-globalCats[a]);

  grid.style.gridTemplateColumns = `220px repeat(${categories.length}, 60px)`;
  grid.style.gridTemplateRows = `128px repeat(${collegeNames.length}, 42px)`;

  let html = `<div class="mx-corner"><span>Colleges ↓ / Categories →</span></div>`;
  categories.forEach(cat => {
    html += `<div class="mx-colhead" data-category="${escHTML(cat)}" title="${escHTML(cat)} — ${globalCats[cat]} total">
      <span class="mx-label">${escHTML(cat)}</span>
    </div>`;
  });
  collegeNames.forEach(college => {
    const s = summary[college];
    html += `<div class="mx-rowhead" data-rowcollege="${escHTML(college)}" title="${escHTML(college)}">
      <span class="mx-rowhead-name">${escHTML(college)}</span>
      <span class="mx-rowhead-count">${s.total}</span>
    </div>`;
    const rowMax = Math.max(...Object.values(s.byCat), 1);
    categories.forEach(cat => {
      const count = s.byCat[cat] || 0;
      if(count === 0){
        html += `<div class="mx-cell empty">·</div>`;
      } else {
        const alpha = 0.16 + 0.5 * (count / rowMax);
        html += `<div class="mx-cell" data-category="${escHTML(cat)}" data-college="${escHTML(college)}" style="background:${hexToRgba(categoryColor(cat), alpha)}">${count}</div>`;
      }
    });
  });
  grid.innerHTML = html;
}
$('matrix-grid').addEventListener('click', e => {
  const cell = e.target.closest('.mx-cell:not(.empty)');
  if(cell){ openDrawer(cell.dataset.category, cell.dataset.college); return; }
  const rowhead = e.target.closest('.mx-rowhead');
  if(rowhead){ openDrawer(null, rowhead.dataset.rowcollege); return; }
  const colhead = e.target.closest('.mx-colhead');
  if(colhead){ openDrawer(colhead.dataset.category, null); return; }
});

/* ── Drawer: ticket details (name + problem) ── */
function openDrawer(category, collegeScope){
  activeDrawerCategory = category;
  activeDrawerCollege = collegeScope || null;
  $('drawer-search-input').value = '';
  $('drawer-eyebrow-text').textContent = activeDrawerCollege ? activeDrawerCollege : 'All colleges';
  $('drawer-title').textContent = category ? category : 'All categories';
  const list = drawerTickets();
  $('drawer-meta').textContent = `${list.length} ticket${list.length===1?'':'s'}`;
  renderDrawerList();
  $('drawer-overlay').classList.add('open');
  $('drawer').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDrawer(){
  $('drawer-overlay').classList.remove('open');
  $('drawer').classList.remove('open');
  document.body.style.overflow = '';
}
$('drawer-overlay').addEventListener('click', closeDrawer);
$('drawer-close-btn').addEventListener('click', closeDrawer);
function drawerTickets(){
  let list = activeDrawerCollege ? tickets.filter(t => (t.college||'Unspecified') === activeDrawerCollege) : tickets;
  if(activeDrawerCategory) list = list.filter(t => (t.category || 'Other') === activeDrawerCategory);
  return list.slice().sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
}
function renderDrawerList(){
  const q = ($('drawer-search-input').value||'').toLowerCase().trim();
  let list = drawerTickets();
  if(q){
    list = list.filter(t =>
      (t.student_name||'').toLowerCase().includes(q) ||
      (t.roll_number||'').toLowerCase().includes(q) ||
      (t.subject||'').toLowerCase().includes(q) ||
      (t.description||'').toLowerCase().includes(q) ||
      (t.college||'').toLowerCase().includes(q));
  }
  const bodyEl = $('drawer-body');
  if(!list.length){
    bodyEl.innerHTML = `<div class="drawer-empty">No matching tickets.</div>`;
    return;
  }
  bodyEl.innerHTML = list.map(t => {
    const statusCls = {open:'st-open',progress:'st-progress',resolved:'st-resolved'}[t.status] || 'st-open';
    const statusLbl = {open:'Unresolved',progress:'In Progress',resolved:'Resolved'}[t.status] || t.status;
    const prio = t.priority || 'medium';
    return `<div class="tk-row">
      <div class="tk-row-top">
        <div class="tk-who">
          <div style="min-width:0;">
            <div class="tk-name" title="${escHTML(t.student_name)}">${escHTML(t.student_name || 'Unknown student')}</div>
            <div class="tk-roll">#${escHTML(t.roll_number || '—')}</div>
          </div>
        </div>
        <div class="tk-time">${fmtRel(t.created_at)}</div>
      </div>
      <div class="tk-subject">${escHTML(t.subject || '(No subject)')}</div>
      ${t.description ? `<div class="tk-desc">${escHTML(t.description)}</div>` : ''}
      <div class="tk-foot">
        <span class="tk-pill ${statusCls}">${statusLbl}</span>
        <span class="tk-pill pr-${prio}">${prio}</span>
        ${!activeDrawerCollege && t.college ? `<span class="tk-pill college">${escHTML(t.college)}</span>` : ''}
        ${!activeDrawerCategory && t.category ? `<span class="tk-pill college">${escHTML(t.category)}</span>` : ''}
      </div>
    </div>`;
  }).join('');
  bodyEl.querySelectorAll('.tk-row').forEach(row => row.addEventListener('click', () => row.classList.toggle('expanded')));
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });

loadAll();
</script>
