<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FACE Prep Campus — Insight Deck</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F7F5F1; --panel:#FFFFFF; --panel-dim:#FBFAF7;
  --line:rgba(24,18,12,0.11); --line-soft:rgba(24,18,12,0.06);
  --ink:#1B1620; --ink-dim:#665F76; --ink-faint:#948DA0;
  --brand-1:#D11AB3; --brand-2:#EF6E5C; --brand-3:#F6A968; --brand-4:#7C5CFC; --brand-5:#E879C6;
  --brand-gradient:linear-gradient(120deg,var(--brand-1) 0%,var(--brand-2) 55%,var(--brand-3) 100%);
  --col-open:#DC2626; --col-progress:#B45309; --col-resolved:#15803D;
  --shadow-md:0 14px 34px -16px rgba(24,18,12,.14); --shadow-lg:0 28px 64px -20px rgba(24,18,12,.24);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;}
::selection{background:var(--brand-1);color:#fff;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#E2DED6;border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:#CFC9BE;}
:focus-visible{outline:2px solid var(--brand-3);outline-offset:2px;}
.hidden{display:none !important;}

.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-glow span{position:absolute;border-radius:50%;filter:blur(130px);opacity:.12;}
.bg-glow .g1{width:520px;height:520px;top:-180px;left:-120px;background:var(--brand-1);}
.bg-glow .g2{width:560px;height:560px;bottom:-220px;right:-140px;background:var(--brand-4);}

.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;}

/* ── Header ── */
.topbar{flex-shrink:0;padding:22px 32px 0;}
.tb-row1{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:11px;}
.brand-icon{width:36px;height:36px;border-radius:11px;background:var(--brand-gradient);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:#fff;flex-shrink:0;box-shadow:0 8px 18px -6px rgba(209,26,179,.5);}
.brand-eyebrow{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);}
.brand-title{font-family:'Fraunces',serif;font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink);line-height:1.15;}
.ticker{display:flex;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);}
.tick{padding:8px 16px;text-align:center;border-right:1px solid var(--line);}
.tick:last-child{border-right:none;}
.tick b{display:block;font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
.tick span{font-size:9px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.refresh-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .12s,color .12s;}
.refresh-btn:hover{background:var(--panel-dim);color:var(--ink);}
.refresh-btn svg{width:14px;height:14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.refresh-btn.spinning svg{animation:spin .7s linear infinite;}

.tb-row2{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;}
.filter-search{position:relative;flex:1;min-width:200px;max-width:320px;}
.filter-search input{width:100%;padding:9px 12px 9px 32px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--ink);outline:none;transition:border-color .15s;}
.filter-search input::placeholder{color:var(--ink-faint);}
.filter-search input:focus{border-color:var(--brand-3);}
.filter-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--ink-faint);pointer-events:none;}
.filter-select{padding:9px 30px 9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="%23948DA0" stroke-width="1.6"><path d="M4 6l4 4 4-4"/></svg>') no-repeat right 10px center;background-size:11px;font-size:12.5px;color:var(--ink);outline:none;cursor:pointer;appearance:none;max-width:200px;}
.filter-select:focus{border-color:var(--brand-3);}
.filter-clear{font-size:11.5px;font-weight:700;color:var(--brand-1);background:none;border:none;cursor:pointer;padding:6px 4px;white-space:nowrap;}
.filter-clear.hidden{display:none;}
.tb-divider{height:1px;background:var(--line);margin-top:18px;}

/* ── Board ── */
.board{flex:1;min-height:0;display:flex;gap:18px;padding:18px 32px 26px;overflow-x:auto;overflow-y:hidden;}
.col{flex:1;min-width:300px;max-width:420px;display:flex;flex-direction:column;background:var(--panel-dim);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-md);}
.col-head{flex-shrink:0;padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;}
.col-head::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--col-accent);}
.col-head-name{display:flex;align-items:center;gap:9px;}
.col-dot{width:9px;height:9px;border-radius:50%;background:var(--col-accent);flex-shrink:0;}
.col-title{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;color:var(--ink);}
.col-count{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--ink-dim);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 8px;flex-shrink:0;}
.col-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.col-empty{padding:36px 14px;text-align:center;color:var(--ink-faint);font-size:12px;}

/* ── Ticket card ── */
.tk-card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cat-color,var(--brand-1));border-radius:13px;padding:14px 15px;cursor:pointer;transition:transform .13s,box-shadow .13s,border-color .13s;}
.tk-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(24,18,12,.22);}
.tk-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.tk-who{display:flex;align-items:center;gap:9px;min-width:0;}
.tk-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;}
.tk-name{font-size:12.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;}
.tk-roll{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-faint);}
.tk-time{font-size:10px;color:var(--ink-faint);flex-shrink:0;white-space:nowrap;font-family:'JetBrains Mono',monospace;margin-top:2px;}
.tk-subject{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:10px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.tk-foot{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap;}
.tk-pill{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.02em;}
.tk-pill.cat{color:#fff;}
.tk-pill.college{background:var(--panel-dim);border:1px solid var(--line);color:var(--ink-dim);text-transform:none;font-weight:600;letter-spacing:0;}
.tk-pill.pr-high{background:#DC2626;color:#fff;}
.tk-pill.pr-medium{background:rgba(180,83,9,.14);color:var(--col-progress);}
.tk-pill.pr-low{background:var(--panel-dim);border:1px solid var(--line);color:var(--ink-dim);}

.skel-card{height:96px;border-radius:13px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel-dim) 37%,var(--panel) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;}
@keyframes shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

.board-empty{flex:1;display:flex;align-items:center;justify-content:center;}
.board-empty-inner{text-align:center;color:var(--ink-dim);padding:40px;}
.board-empty-inner .ic{width:64px;height:64px;border-radius:18px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--ink-faint);}
.board-empty-inner strong{font-family:'Fraunces',serif;font-size:17px;font-weight:600;display:block;color:var(--ink);}
.board-empty-inner p{font-size:12.5px;color:var(--ink-faint);margin-top:6px;}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(6,4,10,.55);backdrop-filter:blur(2px);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal{width:min(520px,100%);max-height:86vh;background:var(--panel);border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateY(14px) scale(.98);transition:transform .24s cubic-bezier(.19,1,.22,1);overflow:hidden;}
.modal-overlay.open .modal{transform:translateY(0) scale(1);}
.modal-head{padding:22px 24px;border-bottom:1px solid var(--line);position:relative;flex-shrink:0;}
.modal-head::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--brand-gradient);}
.modal-head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
.modal-who{display:flex;align-items:center;gap:12px;min-width:0;}
.modal-avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;}
.modal-name{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--ink);}
.modal-roll{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);margin-top:2px;}
.modal-close{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--panel-dim);color:var(--ink-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;transition:background .12s,color .12s;}
.modal-close:hover{background:var(--panel);color:var(--ink);}
.modal-body{flex:1;overflow-y:auto;padding:20px 24px 26px;}
.modal-subject{font-size:15px;font-weight:700;color:var(--ink);line-height:1.4;}
.modal-desc{font-size:13px;color:var(--ink-dim);margin-top:10px;line-height:1.65;}
.modal-pills{display:flex;align-items:center;gap:7px;margin-top:16px;flex-wrap:wrap;}
.modal-meta{display:flex;flex-direction:column;gap:9px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft);}
.modal-meta-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;}
.modal-meta-row span:first-child{color:var(--ink-faint);font-weight:600;}
.modal-meta-row span:last-child{color:var(--ink);font-weight:600;}

@media (max-width:860px){
  .topbar,.board{padding-left:16px;padding-right:16px;}
  .ticker{display:none;}
  .board{flex-direction:column;overflow-y:auto;overflow-x:hidden;}
  .col{max-width:none;max-height:none;}
  .col-body{max-height:none;}
}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important;} }
</style>
</head>
<body>
<div class="bg-glow"><span class="g1"></span><span class="g2"></span></div>
<div class="app">
  <div class="topbar">
    <div class="tb-row1">
      <div class="brand">
        <div class="brand-icon">FP</div>
        <div>
          <div class="brand-eyebrow">Campus Help Desk</div>
          <div class="brand-title">Insight Deck</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="ticker">
          <div class="tick"><b id="stat-total">0</b><span>Tickets</span></div>
          <div class="tick"><b id="stat-open">0</b><span>Unresolved</span></div>
          <div class="tick"><b id="stat-colleges">0</b><span>Colleges</span></div>
        </div>
        <button class="refresh-btn" id="refresh-btn" title="Refresh">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.5 2.5A6.5 6.5 0 1 1 8 1.5"/><polyline points="13.5,2.5 13.5,6 10,6"/></svg>
        </button>
      </div>
    </div>
    <div class="tb-row2">
      <div class="filter-search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><line x1="10.8" y1="10.8" x2="14" y2="14"/></svg>
        <input id="search-input" type="text" placeholder="Search name, roll no., problem…" />
      </div>
      <select class="filter-select" id="college-select"><option value="">All colleges</option></select>
      <select class="filter-select" id="category-select"><option value="">All categories</option></select>
      <select class="filter-select" id="priority-select">
        <option value="">All priorities</option>
        <option value="high">High priority</option>
        <option value="medium">Medium priority</option>
        <option value="low">Low priority</option>
      </select>
      <button class="filter-clear hidden" id="clear-filters">Clear filters</button>
    </div>
    <div class="tb-divider"></div>
  </div>

  <div class="board" id="board">
    <div class="col">
      <div class="col-head" style="--col-accent:var(--col-open)">
        <div class="col-head-name"><span class="col-dot"></span><span class="col-title">Unresolved</span></div>
        <span class="col-count" id="count-open">0</span>
      </div>
      <div class="col-body" id="body-open"><div class="skel-card"></div><div class="skel-card"></div></div>
    </div>
    <div class="col">
      <div class="col-head" style="--col-accent:var(--col-progress)">
        <div class="col-head-name"><span class="col-dot"></span><span class="col-title">In Progress</span></div>
        <span class="col-count" id="count-progress">0</span>
      </div>
      <div class="col-body" id="body-progress"><div class="skel-card"></div><div class="skel-card"></div></div>
    </div>
    <div class="col">
      <div class="col-head" style="--col-accent:var(--col-resolved)">
        <div class="col-head-name"><span class="col-dot"></span><span class="col-title">Resolved</span></div>
        <span class="col-count" id="count-resolved">0</span>
      </div>
      <div class="col-body" id="body-resolved"><div class="skel-card"></div><div class="skel-card"></div></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-head-top">
        <div class="modal-who">
          <div class="modal-avatar" id="modal-avatar">?</div>
          <div style="min-width:0;">
            <div class="modal-name" id="modal-name">—</div>
            <div class="modal-roll" id="modal-roll">—</div>
          </div>
        </div>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-subject" id="modal-subject">—</div>
      <div class="modal-desc hidden" id="modal-desc"></div>
      <div class="modal-pills" id="modal-pills"></div>
      <div class="modal-meta">
        <div class="modal-meta-row"><span>College</span><span id="modal-college">—</span></div>
        <div class="modal-meta-row"><span>Category</span><span id="modal-category">—</span></div>
        <div class="modal-meta-row"><span>Reported</span><span id="modal-time">—</span></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ── Supabase (same public tickets table as the main help-desk dashboard) ── */
const SUPABASE_URL = 'https://rysajbwcuieovbsllaas.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5c2FqYndjdWllb3Zic2xsYWFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NjI3MjgsImV4cCI6MjA5NjAzODcyOH0.2WenjYKsfQYAeUJxVJcEVQwqYUlfwrYltrMuC9Ggu4A';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
function escHTML(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtRel(iso){
  if(!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h = Math.floor(m/60);
  if(h<24) return h+'h ago';
  const d = Math.floor(h/24);
  if(d<30) return d+'d ago';
  return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}
function fmtFull(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function initials(name){
  const parts = String(name||'?').trim().split(/\s+/);
  return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase() || '?';
}
function avatarColor(name){
  const palette = ['#D11AB3','#7C5CFC','#EF6E5C','#3457E8','#2DD9A8','#F0A93A','#E879C6','#0EA5A4'];
  let h = 0; for(const c of String(name||'')) h = (h*31 + c.charCodeAt(0)) % 997;
  return palette[h % palette.length];
}
const CATEGORY_PALETTE = ['#EF6E5C','#7C5CFC','#2DD9A8','#F6A968','#D11AB3','#5B9CFF','#E879C6','#F0A93A','#4ADE80','#FF6B6B','#A78BFA','#F472B6'];
function categoryColor(cat){
  let h = 0; for(const c of String(cat||'')) h = (h*31 + c.charCodeAt(0)) % 9973;
  return CATEGORY_PALETTE[h % CATEGORY_PALETTE.length];
}

/* ── State ── */
let tickets = [];
let filters = { search:'', college:'', category:'', priority:'' };

async function loadAll(manual){
  const btn = $('refresh-btn');
  if(manual) btn.classList.add('spinning');
  try{
    const { data, error } = await sb.from('tickets').select('*').order('created_at', { ascending:false });
    if(error) throw error;
    tickets = data || [];
  }catch(e){
    console.error(e);
  }finally{
    if(manual) setTimeout(()=>btn.classList.remove('spinning'), 400);
    populateFilterOptions();
    render();
  }
}

function populateFilterOptions(){
  const collegeSel = $('college-select'), catSel = $('category-select');
  const prevCollege = collegeSel.value, prevCat = catSel.value;
  const colleges = [...new Set(tickets.map(t => t.college || 'Unspecified'))].sort();
  const cats = [...new Set(tickets.map(t => t.category || 'Other'))].sort();
  collegeSel.innerHTML = '<option value="">All colleges</option>' + colleges.map(c => `<option value="${escHTML(c)}">${escHTML(c)}</option>`).join('');
  catSel.innerHTML = '<option value="">All categories</option>' + cats.map(c => `<option value="${escHTML(c)}">${escHTML(c)}</option>`).join('');
  collegeSel.value = prevCollege; catSel.value = prevCat;
}

function filteredTickets(){
  const q = filters.search.toLowerCase().trim();
  return tickets.filter(t => {
    if(filters.college && (t.college||'Unspecified') !== filters.college) return false;
    if(filters.category && (t.category||'Other') !== filters.category) return false;
    if(filters.priority && (t.priority||'medium') !== filters.priority) return false;
    if(q){
      const hay = [t.student_name,t.roll_number,t.subject,t.description,t.college].map(x=>String(x||'').toLowerCase()).join(' ');
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function render(){
  const scope = filteredTickets();
  $('stat-total').textContent = scope.length;
  $('stat-open').textContent = scope.filter(t => t.status !== 'resolved').length;
  $('stat-colleges').textContent = new Set(scope.map(t => t.college||'Unspecified')).size;

  const hasFilters = filters.search || filters.college || filters.category || filters.priority;
  $('clear-filters').classList.toggle('hidden', !hasFilters);

  const board = $('board');
  if(!tickets.length){
    // still loading or truly empty — skeleton already showing, leave as is until first load completes
  }

  const groups = { open:[], progress:[], resolved:[] };
  scope.forEach(t => {
    const s = groups[t.status] ? t.status : 'open';
    groups[s].push(t);
  });

  ['open','progress','resolved'].forEach(status => {
    const list = groups[status];
    $('count-'+status).textContent = list.length;
    const bodyEl = $('body-'+status);
    if(!list.length){
      bodyEl.innerHTML = `<div class="col-empty">${tickets.length ? 'No matching tickets.' : 'Loading…'}</div>`;
      return;
    }
    bodyEl.innerHTML = list.map(cardHTML).join('');
  });

  document.querySelectorAll('.tk-card').forEach(card => {
    card.addEventListener('click', () => openModal(card.dataset.id));
  });
}

function cardHTML(t){
  const cat = t.category || 'Other';
  const color = categoryColor(cat);
  const prio = t.priority || 'medium';
  return `<div class="tk-card" data-id="${escHTML(t.id)}" style="--cat-color:${color}">
    <div class="tk-card-top">
      <div class="tk-who">
        <div class="tk-avatar" style="background:${avatarColor(t.student_name)}">${initials(t.student_name)}</div>
        <div style="min-width:0;">
          <div class="tk-name" title="${escHTML(t.student_name)}">${escHTML(t.student_name || 'Unknown student')}</div>
          <div class="tk-roll">#${escHTML(t.roll_number || '—')}</div>
        </div>
      </div>
      <div class="tk-time">${fmtRel(t.created_at)}</div>
    </div>
    <div class="tk-subject">${escHTML(t.subject || '(No subject)')}</div>
    <div class="tk-foot">
      <span class="tk-pill cat" style="background:${color}">${escHTML(cat)}</span>
      <span class="tk-pill pr-${prio}">${prio}</span>
      <span class="tk-pill college">${escHTML(t.college || 'Unspecified')}</span>
    </div>
  </div>`;
}

/* ── Filters wiring ── */
$('search-input').addEventListener('input', e => { filters.search = e.target.value; render(); });
$('college-select').addEventListener('change', e => { filters.college = e.target.value; render(); });
$('category-select').addEventListener('change', e => { filters.category = e.target.value; render(); });
$('priority-select').addEventListener('change', e => { filters.priority = e.target.value; render(); });
$('clear-filters').addEventListener('click', () => {
  filters = { search:'', college:'', category:'', priority:'' };
  $('search-input').value=''; $('college-select').value=''; $('category-select').value=''; $('priority-select').value='';
  render();
});
$('refresh-btn').addEventListener('click', () => loadAll(true));

/* ── Modal ── */
function openModal(id){
  const t = tickets.find(x => String(x.id) === String(id));
  if(!t) return;
  const cat = t.category || 'Other';
  const color = categoryColor(cat);
  const prio = t.priority || 'medium';
  const statusCls = {open:'st-open',progress:'st-progress',resolved:'st-resolved'}[t.status] || 'st-open';
  const statusLbl = {open:'Unresolved',progress:'In Progress',resolved:'Resolved'}[t.status] || t.status;

  $('modal-avatar').style.background = avatarColor(t.student_name);
  $('modal-avatar').textContent = initials(t.student_name);
  $('modal-name').textContent = t.student_name || 'Unknown student';
  $('modal-roll').textContent = '#' + (t.roll_number || '—');
  $('modal-subject').textContent = t.subject || '(No subject)';
  const descEl = $('modal-desc');
  if(t.description){ descEl.textContent = t.description; descEl.classList.remove('hidden'); }
  else { descEl.classList.add('hidden'); }

  $('modal-pills').innerHTML = `
    <span class="tk-pill cat" style="background:${color}">${escHTML(cat)}</span>
    <span class="tk-pill pr-${prio}">${prio}</span>
    <span class="tk-pill" style="background:${statusColorBg(t.status)};color:${statusColorFg(t.status)}">${statusLbl}</span>`;

  $('modal-college').textContent = t.college || 'Unspecified';
  $('modal-category').textContent = cat;
  $('modal-time').textContent = fmtFull(t.created_at);

  $('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function statusColorBg(s){ return s==='resolved' ? 'rgba(21,128,61,.14)' : s==='progress' ? 'rgba(180,83,9,.14)' : 'rgba(220,38,38,.14)'; }
function statusColorFg(s){ return s==='resolved' ? '#15803D' : s==='progress' ? '#B45309' : '#DC2626'; }
function closeModal(){
  $('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
$('modal-overlay').addEventListener('click', e => { if(e.target.id === 'modal-overlay') closeModal(); });
$('modal-close-btn').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

loadAll();
</script>
</body>
</html>
