<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FACE Prep Campus — Insight Deck</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink-950:#F4F5F7; --ink-900:#FFFFFF; --ink-850:#F7F8FA; --ink-800:#EEF0F3; --ink-750:#E5E8EC;
  --line:rgba(20,24,31,0.08); --line-soft:rgba(20,24,31,0.05);
  --paper:#14181F; --paper-dim:#6B7280; --paper-faint:#9AA1AC;
  --brand-1:#6FCF57; --brand-2:#4CAF50; --brand-3:#8BD46E; --brand-4:#3B8F44; --brand-5:#A5E88C;
  --brand-gradient:linear-gradient(120deg,var(--brand-4) 0%,var(--brand-1) 100%);
  --mint:#2E9E4F; --amber:#E08A2C; --coral:#E0552C;
  --shadow-md:0 10px 26px -14px rgba(20,24,31,.12); --shadow-lg:0 22px 50px -18px rgba(20,24,31,.18);
}
body{font-family:'Inter',sans-serif;background:var(--ink-950);color:var(--paper);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden;}
::selection{background:var(--brand-1);color:#fff;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#DADEE3;border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:#C6CBD2;}
:focus-visible{outline:2px solid var(--brand-1);outline-offset:2px;}

.bg-glow{display:none;}

.shell{position:relative;z-index:1;display:flex;height:100vh;overflow:hidden;padding:14px;gap:14px;}

/* ── Sidebar / roster ── */
.sidebar{width:296px;flex-shrink:0;background:var(--ink-900);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;height:100%;box-shadow:var(--shadow-md);}
.sidebar-head{padding:22px 20px 16px;border-bottom:1px solid var(--line);position:relative;}
.sb-mark{display:flex;align-items:center;gap:10px;}
.sb-mark-icon{width:34px;height:34px;border-radius:11px;background:var(--brand-gradient);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-weight:800;font-size:14px;color:#fff;flex-shrink:0;box-shadow:0 8px 18px -6px rgba(76,175,80,.45);}
.sb-eyebrow{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--paper-faint);}
.sb-title{font-family:'Inter',sans-serif;font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--paper);line-height:1.2;}
.sb-sub{font-size:11.5px;color:var(--paper-faint);margin-top:10px;line-height:1.55;}
.sb-search{margin:14px 20px 6px;position:relative;}
.sb-search input{width:100%;padding:10px 12px 10px 32px;border-radius:11px;border:1px solid var(--line);background:var(--ink-850);font-size:12.5px;color:var(--paper);outline:none;transition:border-color .15s,background .15s;}
.sb-search input::placeholder{color:var(--paper-faint);}
.sb-search input:focus{border-color:var(--brand-1);background:var(--ink-900);}
.sb-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--paper-faint);pointer-events:none;}
.sb-list{flex:1;overflow-y:auto;padding:8px 12px 20px;}
.sb-item{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:12px 13px;border-radius:14px;border:1px solid transparent;background:transparent;cursor:pointer;margin-bottom:4px;transition:background .12s,border-color .12s,transform .1s;}
.sb-item:hover{background:var(--ink-850);}
.sb-item.active{background:#EEF9EA;border-color:rgba(76,175,80,.30);}
.sb-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sb-item-name{font-size:12.5px;font-weight:700;color:var(--paper);line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.sb-item.active .sb-item-name{color:var(--brand-4);}
.sb-item-count{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:var(--paper-dim);background:var(--ink-800);border-radius:7px;padding:2px 7px;flex-shrink:0;}
.sb-item.active .sb-item-count{background:var(--brand-4);color:#fff;}
.sb-item-bar{display:flex;height:5px;border-radius:99px;overflow:hidden;background:var(--ink-800);}
.sb-item-bar span{height:100%;}
.sb-allitem{position:relative;border:1px dashed var(--line);}
.sb-allitem .sb-item-name{font-family:'Inter',sans-serif;font-weight:800;font-size:13.5px;}
.sb-empty{padding:30px 14px;text-align:center;color:var(--paper-faint);font-size:12px;}
.sb-foot{padding:13px 20px 17px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sb-foot-meta{font-size:10.5px;color:var(--paper-faint);line-height:1.5;font-family:'Inter',sans-serif;}
.sb-refresh{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--ink-850);color:var(--paper-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .12s,color .12s;}
.sb-refresh:hover{background:var(--ink-800);color:var(--paper);}
.sb-refresh svg{width:13px;height:13px;}
@keyframes spin{to{transform:rotate(360deg);}}
.sb-refresh.spinning svg{animation:spin .7s linear infinite;}

/* ── Main ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--ink-900);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-md);}
.main-head{padding:24px 32px 0;flex-shrink:0;}
.mh-crumb{font-size:11.5px;color:var(--paper-faint);font-weight:600;display:flex;align-items:center;gap:8px;}
.mh-crumb b{color:var(--brand-4);font-weight:700;}
.mh-titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-top:8px;flex-wrap:wrap;}
.mh-title{font-family:'Inter',sans-serif;font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--paper);}
.mh-ticker{display:flex;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--ink-850);}
.mh-tick{padding:10px 18px;text-align:center;border-right:1px solid var(--line);}
.mh-tick:last-child{border-right:none;}
.mh-tick b{display:block;font-family:'Inter',sans-serif;font-size:19px;font-weight:800;color:var(--paper);letter-spacing:-.01em;}
.mh-tick span{font-size:9.5px;color:var(--paper-faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.mh-tick.is-open b{color:var(--coral);}
.mh-tick.is-resolved b{color:var(--mint);}
.mh-toolrow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px;flex-wrap:wrap;}
.view-toggle{display:none;gap:4px;background:var(--ink-850);border:1px solid var(--line);border-radius:11px;padding:4px;}
.view-toggle.show{display:inline-flex;}
.view-toggle button{padding:7px 14px;border-radius:8px;border:none;background:transparent;color:var(--paper-faint);font-size:12px;font-weight:700;cursor:pointer;transition:background .15s,color .15s;}
.view-toggle button.active{background:var(--brand-gradient);color:#fff;}
.mh-hint{font-size:11.5px;color:var(--paper-faint);}
.mh-divider{height:1px;background:var(--line);margin:16px 0 0;}

.main-body{flex:1;min-height:0;overflow-y:auto;padding:22px 32px 40px;}

/* ── Matrix (heatmap) ── */
.matrix-wrap{border:1px solid var(--line);border-radius:18px;background:var(--ink-850);overflow:auto;box-shadow:var(--shadow-md);}
.matrix-grid{display:grid;}
.mx-corner{position:sticky;top:0;left:0;z-index:6;background:var(--ink-850);border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;align-items:flex-end;padding:14px 16px;}
.mx-corner span{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--paper-faint);font-style:italic;}
.mx-colhead{position:sticky;top:0;z-index:4;background:var(--ink-850);border-bottom:1px solid var(--line);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding:12px 0 12px;cursor:pointer;transition:background .12s;}
.mx-colhead:hover{background:var(--ink-800);}
.mx-colhead .mx-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.mx-colhead .mx-label{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-size:10.5px;font-weight:700;color:var(--paper-dim);letter-spacing:.01em;white-space:nowrap;max-height:112px;overflow:hidden;text-overflow:ellipsis;}
.mx-rowhead{position:sticky;left:0;z-index:3;background:var(--ink-850);border-right:1px solid var(--line);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;cursor:pointer;transition:background .12s;}
.mx-rowhead:hover{background:var(--ink-800);}
.mx-rowhead-name{font-size:12px;font-weight:700;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mx-rowhead-count{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--paper-faint);flex-shrink:0;}
.mx-cell{display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:var(--paper);border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);cursor:pointer;position:relative;transition:filter .1s;}
.mx-cell:hover{filter:brightness(1.06);}
.mx-cell.empty{cursor:default;color:var(--paper-faint);font-weight:500;}
.mx-cell.empty:hover{filter:none;}

/* ── Leaderboard (single-college / aggregated) ── */
.lb-list{display:flex;flex-direction:column;gap:10px;max-width:760px;}
.lb-row{display:flex;align-items:center;gap:15px;padding:14px 17px;background:var(--ink-850);border:1px solid var(--line);border-radius:16px;cursor:pointer;transition:transform .13s,border-color .13s,background .13s;}
.lb-row:hover{transform:translateX(4px);border-color:rgba(20,24,31,.14);background:var(--ink-800);}
.lb-rank{font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;color:var(--paper-faint);width:20px;flex-shrink:0;}
.lb-stamp{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--cat-color,var(--brand-1));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--cat-color,var(--brand-4));flex-shrink:0;background:#fff;}
.lb-body{flex:1;min-width:0;}
.lb-name{font-size:13.5px;font-weight:700;color:var(--paper);}
.lb-track{height:7px;border-radius:99px;background:var(--ink-800);overflow:hidden;margin-top:8px;}
.lb-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.16,1,.3,1);}
.lb-open{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--coral);font-weight:700;margin-top:6px;}
.lb-open .dot{width:5px;height:5px;border-radius:50%;background:var(--coral);}
.lb-count{font-family:'Inter',sans-serif;font-size:19px;font-weight:800;color:var(--paper);width:46px;text-align:right;flex-shrink:0;}
.lb-arrow{color:var(--paper-faint);flex-shrink:0;}

.empty-block{padding:80px 20px;text-align:center;color:var(--paper-dim);}
.empty-block .ic{width:64px;height:64px;border-radius:18px;background:var(--ink-850);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--paper-faint);}
.empty-block strong{font-family:'Inter',sans-serif;font-size:17px;font-weight:800;display:block;color:var(--paper);}
.empty-block p{font-size:12.5px;color:var(--paper-faint);margin-top:6px;}

.skel-grid{display:flex;flex-direction:column;gap:10px;max-width:760px;}
.skel-row{height:68px;border-radius:16px;background:linear-gradient(90deg,var(--ink-850) 25%,var(--ink-800) 37%,var(--ink-850) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;}
@keyframes shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

/* ── Drawer ── */
.drawer-overlay{position:fixed;inset:0;background:rgba(20,24,31,.42);backdrop-filter:blur(2px);z-index:80;opacity:0;pointer-events:none;transition:opacity .22s;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:14px;right:14px;bottom:14px;width:min(500px,92vw);background:var(--ink-900);z-index:90;box-shadow:var(--shadow-lg);transform:translateX(calc(100% + 14px));transition:transform .32s cubic-bezier(.19,1,.22,1);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:22px;overflow:hidden;}
.drawer.open{transform:translateX(0);}
.drawer-head{background:var(--ink-850);border-bottom:1px solid var(--line);padding:22px 24px;flex-shrink:0;position:relative;}
.drawer-head::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--brand-gradient);}
.drawer-head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
.drawer-eyebrow{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;color:var(--paper-faint);text-transform:uppercase;letter-spacing:.06em;}
.drawer-eyebrow .stamp{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--cat-color,var(--brand-1));display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--cat-color,var(--brand-4));background:#fff;}
.drawer-title{font-family:'Inter',sans-serif;font-size:20px;font-weight:800;margin-top:8px;letter-spacing:-.01em;color:var(--paper);}
.drawer-meta{font-size:12px;color:var(--paper-dim);margin-top:5px;}
.drawer-close{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--ink-900);color:var(--paper-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;transition:background .12s,color .12s;}
.drawer-close:hover{background:var(--ink-800);color:var(--paper);}
.drawer-search{margin-top:16px;position:relative;}
.drawer-search input{width:100%;padding:9px 12px 9px 32px;border-radius:10px;border:1px solid var(--line);background:var(--ink-900);color:var(--paper);font-size:12.5px;outline:none;}
.drawer-search input::placeholder{color:var(--paper-faint);}
.drawer-search input:focus{border-color:var(--brand-1);}
.drawer-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--paper-faint);}
.drawer-body{flex:1;overflow-y:auto;padding:18px 24px 32px;}

.tk-row{background:var(--ink-850);border:1px solid var(--line);border-radius:15px;padding:15px 16px;margin-bottom:11px;cursor:pointer;transition:border-color .12s,background .12s;}
.tk-row:hover{border-color:rgba(20,24,31,.14);background:var(--ink-800);}
.tk-row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.tk-who{display:flex;align-items:center;gap:10px;min-width:0;}
.tk-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}
.tk-name{font-size:13px;font-weight:700;color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tk-roll{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--paper-faint);}
.tk-time{font-size:10.5px;color:var(--paper-faint);flex-shrink:0;white-space:nowrap;margin-top:2px;font-family:'Inter',sans-serif;}
.tk-subject{font-size:13px;font-weight:600;color:var(--paper);margin-top:10px;line-height:1.45;}
.tk-desc{font-size:12px;color:var(--paper-dim);margin-top:6px;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.tk-row.expanded .tk-desc{-webkit-line-clamp:unset;}
.tk-foot{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap;}
.tk-pill{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;padding:4px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em;}
.tk-pill.college{background:var(--ink-800);color:var(--paper-dim);text-transform:none;font-weight:600;letter-spacing:0;}
.tk-pill.st-open{background:rgba(224,85,44,.13);color:var(--coral);}
.tk-pill.st-progress{background:rgba(224,138,44,.14);color:var(--amber);}
.tk-pill.st-resolved{background:rgba(46,158,79,.14);color:var(--mint);}
.tk-pill.pr-high{background:var(--coral);color:#fff;}
.tk-pill.pr-medium{background:rgba(224,138,44,.14);color:var(--amber);}
.tk-pill.pr-low{background:var(--ink-800);color:var(--paper-dim);}
.drawer-empty{padding:44px 10px;text-align:center;color:var(--paper-faint);font-size:12.5px;}

@media (max-width:860px){
  .shell{padding:0;gap:0;}
  .sidebar{position:fixed;left:-308px;z-index:60;transition:left .22s;border-radius:0;height:100vh;}
  .sidebar.mobile-open{left:0;}
  .main{border-radius:0;border:none;}
  .main-head,.main-body{padding-left:18px;padding-right:18px;}
  .mobile-menu-btn{display:flex !important;}
  .mh-ticker{display:none;}
  .matrix-wrap{display:none;}
  .drawer{top:0;right:0;bottom:0;border-radius:0;}
}
.mobile-menu-btn{display:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--ink-850);align-items:center;justify-content:center;cursor:pointer;color:var(--paper);flex-shrink:0;}
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important;} }
.hidden{display:none !important;}
</style>
</head>
<body>
<div class="bg-glow"><span class="g1"></span><span class="g2"></span><span class="g3"></span></div>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sb-mark">
        <div class="sb-mark-icon">FP</div>
        <div>
          <div class="sb-eyebrow">Campus Help Desk</div>
          <div class="sb-title">Insight Deck</div>
        </div>
      </div>
      <div class="sb-sub">Where tickets cluster, college by college.</div>
    </div>
    <div class="sb-search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><line x1="10.8" y1="10.8" x2="14" y2="14"/></svg>
      <input id="sb-search-input" type="text" placeholder="Search colleges…" oninput="renderSidebar()" />
    </div>
    <div class="sb-list" id="sb-list"></div>
    <div class="sb-foot">
      <div class="sb-foot-meta" id="sb-foot-meta">Loading…</div>
      <button class="sb-refresh" id="sb-refresh-btn" title="Refresh">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.5 2.5A6.5 6.5 0 1 1 8 1.5"/><polyline points="13.5,2.5 13.5,6 10,6"/></svg>
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="main-head">
      <div class="mh-crumb">
        <button class="mobile-menu-btn" id="mobile-menu-btn">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg>
        </button>
        Insight Deck / <b id="mh-crumb-current">All Colleges</b>
      </div>
      <div class="mh-titlerow">
        <div class="mh-title" id="mh-title">All Colleges</div>
        <div class="mh-ticker">
          <div class="mh-tick"><b id="mh-stat-total">0</b><span>Tickets</span></div>
          <div class="mh-tick is-open"><b id="mh-stat-open">0</b><span>Unresolved</span></div>
          <div class="mh-tick is-resolved"><b id="mh-stat-resolved">0</b><span>Resolved</span></div>
          <div class="mh-tick"><b id="mh-stat-cats">0</b><span>Categories</span></div>
        </div>
      </div>
      <div class="mh-toolrow">
        <div class="mh-hint" id="mh-hint">Every cell is a college × category. Darker means busier — click any cell to see the tickets.</div>
        <div class="view-toggle" id="view-toggle">
          <button data-mode="matrix" id="vt-matrix">Matrix</button>
          <button data-mode="leaderboard" id="vt-leaderboard">Leaderboard</button>
        </div>
      </div>
      <div class="mh-divider"></div>
    </div>
    <div class="main-body" id="main-body">
      <div class="skel-grid" id="skel-grid">
        <div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div>
      </div>
      <div class="matrix-wrap hidden" id="matrix-wrap"><div class="matrix-grid" id="matrix-grid"></div></div>
      <div class="lb-list hidden" id="lb-list"></div>
      <div class="empty-block hidden" id="empty-block"></div>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-head-top">
      <div style="min-width:0;">
        <div class="drawer-eyebrow"><span class="stamp" id="drawer-stamp">·</span><span id="drawer-eyebrow-text">Category</span></div>
        <div class="drawer-title" id="drawer-title">—</div>
        <div class="drawer-meta" id="drawer-meta">—</div>
      </div>
      <button class="drawer-close" id="drawer-close-btn">✕</button>
    </div>
    <div class="drawer-search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><line x1="10.8" y1="10.8" x2="14" y2="14"/></svg>
      <input id="drawer-search-input" type="text" placeholder="Search by name, roll no., problem…" oninput="renderDrawerList()" />
    </div>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script>
/* ── Supabase (same public tickets table as the main help-desk dashboard) ── */
const SUPABASE_URL = 'https://rysajbwcuieovbsllaas.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5c2FqYndjdWllb3Zic2xsYWFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NjI3MjgsImV4cCI6MjA5NjAzODcyOH0.2WenjYKsfQYAeUJxVJcEVQwqYUlfwrYltrMuC9Ggu4A';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const show = el => el.classList.remove('hidden');
const hide = el => el.classList.add('hidden');
function escHTML(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtRel(iso){
  if(!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h = Math.floor(m/60);
  if(h<24) return h+'h ago';
  const d = Math.floor(h/24);
  if(d<30) return d+'d ago';
  return new Date(iso).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}
function initials(name){
  const parts = String(name||'?').trim().split(/\s+/);
  return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase() || '?';
}
function catAbbrev(cat){
  const words = String(cat||'?').trim().split(/\s+/).filter(w => w.length>1);
  if(words.length>=2) return (words[0][0]+words[1][0]).toUpperCase();
  return String(cat||'?').slice(0,2).toUpperCase();
}
function avatarColor(name){
  const palette = ['#4CAF50','#3B8F44','#E08A2C','#3457E8','#2E9E4F','#F2A93A','#E0552C','#0EA5A4'];
  let h = 0; for(const c of String(name||'')) h = (h*31 + c.charCodeAt(0)) % 997;
  return palette[h % palette.length];
}
const CATEGORY_PALETTE = ['#4CAF50','#E08A2C','#3457E8','#8BD46E','#E0552C','#5B9CFF','#2E9E4F','#F2A93A','#7C5CFC','#F2725A','#3B8F44','#F4C542'];
function categoryColor(cat){
  let h = 0; for(const c of String(cat||'')) h = (h*31 + c.charCodeAt(0)) % 9973;
  return CATEGORY_PALETTE[h % CATEGORY_PALETTE.length];
}
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const n = parseInt(h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
}

/* ── State ── */
let tickets = [];
let selectedCollege = null;      // null = "All colleges"
let allViewMode = window.innerWidth > 860 ? 'matrix' : 'leaderboard'; // only relevant when selectedCollege===null
let activeDrawerCategory = null;
let activeDrawerCollege = null;  // null = scope is "all colleges" for the open drawer

async function loadAll(manual){
  const btn = $('sb-refresh-btn');
  if(manual && btn) btn.classList.add('spinning');
  if(!tickets.length){ show($('skel-grid')); hide($('matrix-wrap')); hide($('lb-list')); hide($('empty-block')); }
  try{
    const { data, error } = await sb.from('tickets').select('*').order('created_at', { ascending:false });
    if(error) throw error;
    tickets = data || [];
    $('sb-foot-meta').textContent = `Synced ${new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}`;
  }catch(e){
    console.error(e);
    $('sb-foot-meta').textContent = 'Sync failed';
  }finally{
    if(manual && btn) setTimeout(()=>btn.classList.remove('spinning'), 400);
    renderSidebar();
    renderMain();
  }
}

/* ── Sidebar: college roster ── */
function buildCollegeSummary(){
  const map = {};
  tickets.forEach(t => {
    const c = t.college || 'Unspecified';
    if(!map[c]) map[c] = { total:0, open:0, byCat:{} };
    map[c].total++;
    if(t.status !== 'resolved') map[c].open++;
    const cat = t.category || 'Other';
    map[c].byCat[cat] = (map[c].byCat[cat]||0) + 1;
  });
  return map;
}
function aggregateAllCategories(){
  const byCat = {};
  tickets.forEach(t => { const c = t.category || 'Other'; byCat[c] = (byCat[c]||0)+1; });
  return byCat;
}
function renderSidebar(){
  const listEl = $('sb-list');
  const summary = buildCollegeSummary();
  const q = ($('sb-search-input').value||'').toLowerCase().trim();
  const allTotal = tickets.length;

  let html = '';
  if(!q){
    const allActive = selectedCollege === null;
    html += `<button class="sb-item sb-allitem ${allActive?'active':''}" data-all="1">
      <div class="sb-item-top">
        <span class="sb-item-name">All Colleges</span>
        <span class="sb-item-count">${allTotal}</span>
      </div>
      ${miniBarHTML(aggregateAllCategories())}
    </button>`;
  }

  const names = Object.keys(summary).filter(n => n.toLowerCase().includes(q)).sort((a,b) => summary[b].total - summary[a].total);
  if(!names.length){
    listEl.innerHTML = html || `<div class="sb-empty">No colleges match “${escHTML(q)}”.</div>`;
    return;
  }
  html += names.map(name => {
    const s = summary[name];
    const active = selectedCollege === name;
    return `<button class="sb-item ${active?'active':''}" data-college="${escHTML(name)}">
      <div class="sb-item-top">
        <span class="sb-item-name" title="${escHTML(name)}">${escHTML(name)}</span>
        <span class="sb-item-count">${s.total}</span>
      </div>
      ${miniBarHTML(s.byCat)}
    </button>`;
  }).join('');
  listEl.innerHTML = html;
}
function miniBarHTML(byCat){
  const total = Object.values(byCat).reduce((a,b)=>a+b,0);
  if(!total) return `<div class="sb-item-bar"></div>`;
  const segs = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,val]) =>
    `<span style="width:${(val/total*100)}%;background:${categoryColor(cat)}" title="${escHTML(cat)}: ${val}"></span>`).join('');
  return `<div class="sb-item-bar">${segs}</div>`;
}
$('sb-list').addEventListener('click', e => {
  const btn = e.target.closest('.sb-item');
  if(!btn) return;
  selectCollege(btn.hasAttribute('data-all') ? null : btn.dataset.college);
});
$('sb-refresh-btn').addEventListener('click', () => loadAll(true));
$('mobile-menu-btn').addEventListener('click', () => $('sidebar').classList.toggle('mobile-open'));
function selectCollege(name){
  selectedCollege = name;
  renderSidebar();
  renderMain();
  if(window.innerWidth <= 860) $('sidebar').classList.remove('mobile-open');
}

/* ── Main ── */
function scopedTickets(){
  return selectedCollege === null ? tickets : tickets.filter(t => (t.college||'Unspecified') === selectedCollege);
}
function setViewToggleUI(){
  const toggle = $('view-toggle');
  if(selectedCollege === null){
    toggle.classList.add('show');
    $('vt-matrix').classList.toggle('active', allViewMode === 'matrix');
    $('vt-leaderboard').classList.toggle('active', allViewMode === 'leaderboard');
  } else {
    toggle.classList.remove('show');
  }
}
$('vt-matrix').addEventListener('click', () => { allViewMode = 'matrix'; renderMain(); });
$('vt-leaderboard').addEventListener('click', () => { allViewMode = 'leaderboard'; renderMain(); });

function renderMain(){
  hide($('skel-grid'));
  const scope = scopedTickets();
  $('mh-title').textContent = selectedCollege === null ? 'All Colleges' : selectedCollege;
  $('mh-crumb-current').textContent = selectedCollege === null ? 'All Colleges' : selectedCollege;
  $('mh-stat-total').textContent = scope.length;
  $('mh-stat-open').textContent = scope.filter(t => t.status !== 'resolved').length;
  $('mh-stat-resolved').textContent = scope.filter(t => t.status === 'resolved').length;
  setViewToggleUI();

  const byCat = {};
  scope.forEach(t => {
    const cat = t.category || 'Other';
    if(!byCat[cat]) byCat[cat] = { count:0, open:0 };
    byCat[cat].count++;
    if(t.status !== 'resolved') byCat[cat].open++;
  });
  const catCount = Object.keys(byCat).length;
  $('mh-stat-cats').textContent = catCount;

  hide($('matrix-wrap')); hide($('lb-list')); hide($('empty-block'));

  if(!scope.length){
    show($('empty-block'));
    $('empty-block').innerHTML = `
      <div class="ic"><svg width="26" height="26" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3" width="13" height="10" rx="2"/><path d="M1.5 6h13"/></svg></div>
      <strong>No tickets yet</strong>
      <p>${selectedCollege ? escHTML(selectedCollege) + ' has no tickets on record.' : 'Nothing to show yet.'}</p>`;
    return;
  }

  const useMatrix = selectedCollege === null && allViewMode === 'matrix' && window.innerWidth > 860;
  $('mh-hint').textContent = useMatrix
    ? 'Every cell is a college × category. Darker means busier — click any cell to see the tickets.'
    : 'Ranked by ticket volume. Click a category to see who reported what.';

  if(useMatrix) renderMatrix(); else renderLeaderboard(scope, byCat);
}

/* ── Matrix (heatmap) view ── */
function renderMatrix(){
  const wrap = $('matrix-wrap'); const grid = $('matrix-grid');
  show(wrap);
  const summary = buildCollegeSummary();
  const collegeNames = Object.keys(summary).sort((a,b) => summary[b].total - summary[a].total);
  const globalCats = aggregateAllCategories();
  const categories = Object.keys(globalCats).sort((a,b) => globalCats[b]-globalCats[a]);

  grid.style.gridTemplateColumns = `220px repeat(${categories.length}, 60px)`;
  grid.style.gridTemplateRows = `128px repeat(${collegeNames.length}, 42px)`;

  let html = `<div class="mx-corner"><span>Colleges ↓ / Categories →</span></div>`;
  categories.forEach(cat => {
    html += `<div class="mx-colhead" data-category="${escHTML(cat)}" title="${escHTML(cat)} — ${globalCats[cat]} total">
      <span class="mx-label">${escHTML(cat)}</span>
      <span class="mx-dot" style="background:${categoryColor(cat)}"></span>
    </div>`;
  });
  collegeNames.forEach(college => {
    const s = summary[college];
    html += `<div class="mx-rowhead" data-rowcollege="${escHTML(college)}" title="${escHTML(college)}">
      <span class="mx-rowhead-name">${escHTML(college)}</span>
      <span class="mx-rowhead-count">${s.total}</span>
    </div>`;
    const rowMax = Math.max(...Object.values(s.byCat), 1);
    categories.forEach(cat => {
      const count = s.byCat[cat] || 0;
      if(count === 0){
        html += `<div class="mx-cell empty">·</div>`;
      } else {
        const alpha = 0.16 + 0.5 * (count / rowMax);
        html += `<div class="mx-cell" data-category="${escHTML(cat)}" data-college="${escHTML(college)}" style="background:${hexToRgba(categoryColor(cat), alpha)}">${count}</div>`;
      }
    });
  });
  grid.innerHTML = html;
}
$('matrix-grid').addEventListener('click', e => {
  const cell = e.target.closest('.mx-cell:not(.empty)');
  if(cell){ openDrawer(cell.dataset.category, cell.dataset.college); return; }
  const rowhead = e.target.closest('.mx-rowhead');
  if(rowhead){ selectCollege(rowhead.dataset.rowcollege); return; }
  const colhead = e.target.closest('.mx-colhead');
  if(colhead){ openDrawer(colhead.dataset.category, null); return; }
});

/* ── Leaderboard view ── */
function renderLeaderboard(scope, byCat){
  const listEl = $('lb-list');
  show(listEl);
  const entries = Object.entries(byCat).sort((a,b) => b[1].count - a[1].count);
  const max = Math.max(...entries.map(([,v]) => v.count), 1);
  listEl.innerHTML = entries.map(([cat, v], i) => {
    const color = categoryColor(cat);
    const pct = Math.round((v.count/scope.length)*100);
    return `<button class="lb-row" data-category="${escHTML(cat)}">
      <span class="lb-rank">${String(i+1).padStart(2,'0')}</span>
      <span class="lb-stamp" style="--cat-color:${color}">${catAbbrev(cat)}</span>
      <div class="lb-body">
        <div class="lb-name">${escHTML(cat)}</div>
        <div class="lb-track"><div class="lb-fill" style="width:${(v.count/max)*100}%;background:${color}"></div></div>
        ${v.open>0 ? `<div class="lb-open"><span class="dot"></span>${v.open} unresolved</div>` : ''}
      </div>
      <span class="lb-count">${v.count}</span>
      <span class="lb-arrow"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3.5 10.5 8 6 12.5"/></svg></span>
    </button>`;
  }).join('');
}
$('lb-list').addEventListener('click', e => {
  const row = e.target.closest('.lb-row');
  if(!row) return;
  openDrawer(row.dataset.category, selectedCollege);
});

/* ── Drawer: ticket details (name + problem) ── */
function openDrawer(category, collegeScope){
  activeDrawerCategory = category;
  activeDrawerCollege = collegeScope || null;
  $('drawer-search-input').value = '';
  const color = categoryColor(category);
  $('drawer-stamp').style.setProperty('color', color);
  $('drawer-stamp').style.setProperty('border-color', color);
  $('drawer-stamp').textContent = catAbbrev(category);
  $('drawer-eyebrow-text').textContent = activeDrawerCollege ? activeDrawerCollege : 'All colleges';
  $('drawer-title').textContent = category;
  const list = drawerTickets();
  $('drawer-meta').textContent = `${list.length} ticket${list.length===1?'':'s'} in this category`;
  renderDrawerList();
  $('drawer-overlay').classList.add('open');
  $('drawer').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDrawer(){
  $('drawer-overlay').classList.remove('open');
  $('drawer').classList.remove('open');
  document.body.style.overflow = '';
}
$('drawer-overlay').addEventListener('click', closeDrawer);
$('drawer-close-btn').addEventListener('click', closeDrawer);
function drawerTickets(){
  const base = activeDrawerCollege ? tickets.filter(t => (t.college||'Unspecified') === activeDrawerCollege) : tickets;
  return base.filter(t => (t.category || 'Other') === activeDrawerCategory)
             .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
}
function renderDrawerList(){
  const q = ($('drawer-search-input').value||'').toLowerCase().trim();
  let list = drawerTickets();
  if(q){
    list = list.filter(t =>
      (t.student_name||'').toLowerCase().includes(q) ||
      (t.roll_number||'').toLowerCase().includes(q) ||
      (t.subject||'').toLowerCase().includes(q) ||
      (t.description||'').toLowerCase().includes(q) ||
      (t.college||'').toLowerCase().includes(q));
  }
  const bodyEl = $('drawer-body');
  if(!list.length){
    bodyEl.innerHTML = `<div class="drawer-empty">No matching tickets.</div>`;
    return;
  }
  bodyEl.innerHTML = list.map(t => {
    const statusCls = {open:'st-open',progress:'st-progress',resolved:'st-resolved'}[t.status] || 'st-open';
    const statusLbl = {open:'Unresolved',progress:'In Progress',resolved:'Resolved'}[t.status] || t.status;
    const prio = t.priority || 'medium';
    return `<div class="tk-row">
      <div class="tk-row-top">
        <div class="tk-who">
          <div class="tk-avatar" style="background:${avatarColor(t.student_name)}">${initials(t.student_name)}</div>
          <div style="min-width:0;">
            <div class="tk-name" title="${escHTML(t.student_name)}">${escHTML(t.student_name || 'Unknown student')}</div>
            <div class="tk-roll">#${escHTML(t.roll_number || '—')}</div>
          </div>
        </div>
        <div class="tk-time">${fmtRel(t.created_at)}</div>
      </div>
      <div class="tk-subject">${escHTML(t.subject || '(No subject)')}</div>
      ${t.description ? `<div class="tk-desc">${escHTML(t.description)}</div>` : ''}
      <div class="tk-foot">
        <span class="tk-pill ${statusCls}">${statusLbl}</span>
        <span class="tk-pill pr-${prio}">${prio}</span>
        ${!activeDrawerCollege && t.college ? `<span class="tk-pill college">${escHTML(t.college)}</span>` : ''}
      </div>
    </div>`;
  }).join('');
  bodyEl.querySelectorAll('.tk-row').forEach(row => row.addEventListener('click', () => row.classList.toggle('expanded')));
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });
window.addEventListener('resize', () => { if(!tickets.length) return; renderMain(); });

loadAll();
</script>
</body>
</html>
